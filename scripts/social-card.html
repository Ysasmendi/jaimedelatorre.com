<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Social sharing card — Jaime de la Torre</title>
<style>
@font-face { font-family: Inter; src: url('../src/assets/fonts/InterVariable.woff2'); }

* { box-sizing: border-box; }
html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }

.tagline { font-size: 34px; line-height: 1.3; letter-spacing: -.04em; margin: 0; }
.tagline span { color: #3154de; }
.sections { font-size: 17px; color: #596680; margin: 22px 0 0; }
.domain { border-top: 1px solid #becbe0; margin: 48px 0 0; padding-top: 24px; font-size: 19px; color: #3154de; }

<img src="../src/assets/jaime-desktop.webp" alt="Jaime de la Torre de Ysasi-Ysasmendi">
<main>
  <h1><span>Jaime de la Torre</span><span>de Ysasi-Ysasmendi</span></h1>
  <p class="tagline">I scale things from <span>0</span> to <span>∞</span>.</p>
  <p class="sections">Experience · Writing · Contact</p>
  <p class="domain">jaimedelatorre.com</p>
